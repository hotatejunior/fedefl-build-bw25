[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fedefl-bw25"
version = "0.2.0b1"
description = "USLCI · FEDEFL · TRACI 2.2 life-cycle inventory pipeline for brightway25"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Harrison Watson" }]
keywords = ["LCA", "life cycle assessment", "brightway", "USLCI", "FEDEFL", "TRACI"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]

# Declared dependencies are deliberately thin: numpy and scipy only (olca_library
# decodes the baseline's sparse matrices). Brightway, fedelemflowlist and lciafmt
# are NOT declared here even though run/setup_biosphere/setup_traci/setup_baseline/
# setup_uslci import them — that stack is pinned in environment.yml, because the
# EPA packages are not on PyPI and install only from GitHub at specific commits.
# Declaring them here would be a second, drifting source of truth for the versions
# the validation was computed against.
#
# What numpy+scipy alone buys: allocation, run_manifest, chart_units,
# vintage_detect, foreground_importer, olca_library and setup_conversions import
# and unit-test with no brightway present, since they operate on plain data
# supplied by the caller.
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
charts = ["pandas", "matplotlib", "seaborn"]
dev = ["pytest"]

[project.urls]
Repository = "https://github.com/hotatejunior/fedefl-build-bw25"

[tool.setuptools]
packages = ["fedefl_bw25"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
